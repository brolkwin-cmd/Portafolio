<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacta a Mateo Alzate — Diseñador Instruccional y Desarrollador Web. Disponible para proyectos freelance y colaboraciones.">
    <title>Contacto | Mateo Alzate</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/stylecontact.css">
</head>
<body>
    <header>
        <nav class="menu">
            <div class="logomenu">
                <a href="/html/index.html">
                    <img src="/img/logo.svg" alt="Logo Mateo Alzate" class="img">
                </a>
            </div>
            <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <ul class="list">
                <li class="list_item"><a href="/html/proyectos.html">Proyectos</a></li>
                <li class="list_item"><a href="/html/sobremi.html">Sobre Mí</a></li>
                <li class="list_item"><a href="/html/contact.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contacto" class="contacto">
            <h2 class="TextoXp fade-in">¡Hablemos!</h2>
            <p class="Subtitulo fade-in delay-1">¿Tienes un proyecto en mente o buscas un perfil para tu equipo?</p>

            <div class="ContactoGrid fade-in delay-2">

                <div class="ContactoInfo">
                    <h3>Información de contacto</h3>
                    <div class="InfoItem">
                        <span class="InfoIcon">✉</span>
                        <a href="mailto:brolkwin@gmail.com">brolkwin@gmail.com</a>
                    </div>
                    <div class="InfoItem">
                        <span class="InfoIcon">💼</span>
                        <a href="https://www.linkedin.com/in/mateo-alzate-24044431a/" target="_blank" rel="noopener">LinkedIn</a>
                    </div>
                    <div class="InfoItem">
                        <span class="InfoIcon">🐙</span>
                        <a href="https://github.com/brolkwin-cmd" target="_blank" rel="noopener">GitHub</a>
                    </div>
                    <div class="InfoItem">
                        <span class="InfoIcon">📍</span>
                        <span>Bogotá, Colombia</span>
                    </div>
                </div>

                <form action="#" method="POST" class="FormularioContacto" id="contactForm" novalidate>
                    <div class="GrupoForm">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" autocomplete="name" required>
                    </div>
                    <div class="GrupoForm">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" required>
                    </div>
                    <div class="GrupoForm">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="5" placeholder="Cuéntame sobre tu proyecto o consulta..." required></textarea>
                    </div>
                    <button type="submit" class="Boton">Enviar Mensaje</button>
                    <p class="FormFeedback" id="formFeedback" aria-live="polite"></p>
                </form>

            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Mateo Alzate. Todos los derechos reservados.</p>
        <div class="social">
            <a href="https://www.linkedin.com/in/mateo-alzate-24044431a/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://github.com/brolkwin-cmd" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
    </footer>

    <script src="/js/main.js"></script>
</body>
</html>
