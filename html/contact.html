<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Mateo Alzate</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/stylecontact.css">
</head>
<body>
    <header>
        <nav class="menu">
            <div class="logomenu">
                <a href="index.html">
                    <img src="../img/logo.svg" alt="Imagen Logo" class="img">
                </a>
            </div>
            <ul class="list">
                <li class="list_item"><a href="proyectos.html">Proyectos</a></li>
                <li class="list_item"><a href="sobremi.html">Sobre Mí</a></li>
                <li class="list_item"><a href="contact.html" style="color: var(--accent-color);">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contacto" class="contacto">
            <h2 class="TextoXp">¡Hablemos!</h2>
            <p class="Subtitulo">¿Tienes un proyecto en mente o buscas un perfil para tu equipo?</p>

            <div class="ContenedorContacto">
                <form action="#" method="POST" class="FormularioContacto">
                    <div class="GrupoForm">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre">
                    </div>

                    <div class="GrupoForm">                
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="tu@correo.com">
                    </div>

                    <div class="GrupoForm">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="6" placeholder="Cuéntame sobre tu proyecto o consulta..."></textarea>
                    </div>

                    <button type="submit" class="Boton">Enviar Mensaje</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Mateo Alzate. Todos los derechos reservados.</p>
        <div class="social">
            <a href="https://www.linkedin.com/in/mateo-alzate-24044431a/" target="_blank">LinkedIn</a>
            <a href="https://github.com/brolkwin-cmd" target="_blank">GitHub</a>
        </div>
    </footer>
</body>
</html>
